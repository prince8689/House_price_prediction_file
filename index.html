<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>House Price Prediction</title>
</head>
<body>
  <h2>Enter House Details</h2>
  <form id="predictForm">
    <input name="area_type" placeholder="Area Type" required><br>
    <input name="availability" placeholder="Availability" required><br>
    <input name="location" placeholder="Location" required><br>
    <input name="size" placeholder="Size (e.g., 2 BHK)" required><br>
    <input name="society" placeholder="Society" required><br>
    <input name="total_sqft" type="number" placeholder="Total Sqft" required><br>
    <input name="bath" type="number" placeholder="Bathrooms" required><br>
    <input name="balcony" type="number" placeholder="Balcony" required><br>
    <button type="submit">Predict</button>
  </form>

  <h3 id="result"></h3>

  <script>
    Base_url = "http://localhost:3000";
    document.getElementById("predictForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const jsonData = Object.fromEntries(formData.entries());

      const res = await fetch(`${Base_url}/predict`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(jsonData)
      });

      const data = await res.json();
      document.getElementById("result").innerText = `Predicted Price: ${data.prediction}`;
    });
  </script>
</body>
</html>
